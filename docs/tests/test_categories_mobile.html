<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Catégories Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar { 
            display: none;
        }
        
        @media (max-width: 640px) {
            .categories-mobile-scroll {
                scroll-behavior: smooth;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Test Mobile (visible uniquement sur mobile) -->
        <div class="sm:hidden">
            <h3 class="text-lg font-bold mb-4">📱 Version Mobile - Défilement Horizontal</h3>
            <div class="flex overflow-x-auto scrollbar-hide gap-4 pb-4 -mx-4 px-4" style="scroll-snap-type: x mandatory;">
                <!-- Catégorie 1 -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-purple-100 to-purple-200 border-2 border-transparent hover:border-purple-200 rounded-2xl p-4 text-center transition-all duration-300 hover:shadow-xl flex-shrink-0 w-32" style="scroll-snap-align: start;">
                    <div class="text-3xl mb-3">👗</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-xs text-gray-900 leading-tight">Robes</h3>
                        <p class="text-xs text-gray-500">45</p>
                    </div>
                </div>
                
                <!-- Catégorie 2 -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-pink-100 to-pink-200 border-2 border-transparent hover:border-pink-200 rounded-2xl p-4 text-center transition-all duration-300 hover:shadow-xl flex-shrink-0 w-32" style="scroll-snap-align: start;">
                    <div class="text-3xl mb-3">👔</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-xs text-gray-900 leading-tight">Costumes</h3>
                        <p class="text-xs text-gray-500">23</p>
                    </div>
                </div>
                
                <!-- Catégorie 3 -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-blue-100 to-blue-200 border-2 border-transparent hover:border-blue-200 rounded-2xl p-4 text-center transition-all duration-300 hover:shadow-xl flex-shrink-0 w-32" style="scroll-snap-align: start;">
                    <div class="text-3xl mb-3">👠</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-xs text-gray-900 leading-tight">Chaussures</h3>
                        <p class="text-xs text-gray-500">67</p>
                    </div>
                </div>
                
                <!-- Catégorie 4 -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-green-100 to-green-200 border-2 border-transparent hover:border-green-200 rounded-2xl p-4 text-center transition-all duration-300 hover:shadow-xl flex-shrink-0 w-32" style="scroll-snap-align: start;">
                    <div class="text-3xl mb-3">👜</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-xs text-gray-900 leading-tight">Sacs</h3>
                        <p class="text-xs text-gray-500">34</p>
                    </div>
                </div>
                
                <!-- Catégorie 5 -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-yellow-100 to-yellow-200 border-2 border-transparent hover:border-yellow-200 rounded-2xl p-4 text-center transition-all duration-300 hover:shadow-xl flex-shrink-0 w-32" style="scroll-snap-align: start;">
                    <div class="text-3xl mb-3">⌚</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-xs text-gray-900 leading-tight">Montres</h3>
                        <p class="text-xs text-gray-500">12</p>
                    </div>
                </div>
                
                <!-- Catégorie 6 -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-red-100 to-red-200 border-2 border-transparent hover:border-red-200 rounded-2xl p-4 text-center transition-all duration-300 hover:shadow-xl flex-shrink-0 w-32" style="scroll-snap-align: start;">
                    <div class="text-3xl mb-3">💍</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-xs text-gray-900 leading-tight">Bijoux</h3>
                        <p class="text-xs text-gray-500">28</p>
                    </div>
                </div>
            </div>
            <p class="text-sm text-gray-500 mt-2">👈 Faites défiler horizontalement</p>
        </div>
        
        <!-- Test Desktop (visible sur tablette et plus) -->
        <div class="hidden sm:block">
            <h3 class="text-lg font-bold mb-4">💻 Version Desktop - Grille</h3>
            <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Catégories en grille pour desktop -->
                <div class="group relative bg-white hover:bg-gradient-to-br from-purple-100 to-purple-200 border-2 border-transparent rounded-2xl p-6 text-center transition-all duration-300 hover:shadow-xl">
                    <div class="text-4xl lg:text-6xl mb-4">👗</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-sm lg:text-base text-gray-900">Robes</h3>
                        <p class="text-xs lg:text-sm text-gray-500">45 articles</p>
                    </div>
                </div>
                <div class="group relative bg-white hover:bg-gradient-to-br from-pink-100 to-pink-200 border-2 border-transparent rounded-2xl p-6 text-center transition-all duration-300 hover:shadow-xl">
                    <div class="text-4xl lg:text-6xl mb-4">👔</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-sm lg:text-base text-gray-900">Costumes</h3>
                        <p class="text-xs lg:text-sm text-gray-500">23 articles</p>
                    </div>
                </div>
                <div class="group relative bg-white hover:bg-gradient-to-br from-blue-100 to-blue-200 border-2 border-transparent rounded-2xl p-6 text-center transition-all duration-300 hover:shadow-xl">
                    <div class="text-4xl lg:text-6xl mb-4">👠</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-sm lg:text-base text-gray-900">Chaussures</h3>
                        <p class="text-xs lg:text-sm text-gray-500">67 articles</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
