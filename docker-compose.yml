services:
  # Application PHP/Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vintapp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - vintapp-network
    depends_on:
      - mysql

  # Serveur Web Nginx
  webserver:
    image: nginx:alpine
    container_name: vintapp-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - vintapp-network
    depends_on:
      - app

  # Base de données MySQL (version 5.7 déjà installée)
  mysql:
    image: mysql:5.7
    container_name: vintapp-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vintapp
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: vintapp
      MYSQL_PASSWORD: secret
    volumes:
      - vintapp-mysql-data:/var/lib/mysql
    networks:
      - vintapp-network

networks:
  vintapp-network:
    driver: bridge

volumes:
  vintapp-mysql-data:
