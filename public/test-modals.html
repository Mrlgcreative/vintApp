<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test des Modals - VintApp Wallets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        fadeIn: 'fadeIn 0.3s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Test des Modals VintApp</h1>
        
        <!-- Boutons de test -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <button onclick="openModal('createWalletModal')" 
                    class="bg-gradient-to-r from-blue-500 to-blue-700 text-white px-6 py-3 rounded-lg font-semibold hover:from-blue-600 hover:to-blue-800 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:scale-105">
                <i class="fas fa-plus mr-2"></i>Créer Wallet
            </button>
            
            <button onclick="openCommissionModal()" 
                    class="bg-gradient-to-r from-green-500 to-green-700 text-white px-6 py-3 rounded-lg font-semibold hover:from-green-600 hover:to-green-800 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:scale-105">
                <i class="fas fa-percentage mr-2"></i>Ajouter Commission
            </button>
            
            <button onclick="openWithdrawModal(1, 'Test Wallet', 1000)" 
                    class="bg-gradient-to-r from-red-500 to-red-700 text-white px-6 py-3 rounded-lg font-semibold hover:from-red-600 hover:to-red-800 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:scale-105">
                <i class="fas fa-money-bill-wave mr-2"></i>Retirer Fonds
            </button>
        </div>
        
        <!-- Zone de diagnostic -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Diagnostic</h2>
            <div id="diagnostic" class="bg-gray-100 p-4 rounded-lg font-mono text-sm">
                Chargement du diagnostic...
            </div>
        </div>
        
        <!-- Console de test -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Console de Test</h2>
            <button onclick="runTests()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mb-4">
                Exécuter Tests
            </button>
            <div id="testResults" class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm h-64 overflow-y-auto">
                Cliquez sur "Exécuter Tests" pour commencer...
            </div>
        </div>
    </div>

    <!-- Modal Créer Wallet -->
    <div id="createWalletModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform transition-all duration-300 animate-fadeIn">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-800">Créer un Wallet</h3>
                <button onclick="closeModal('createWalletModal')" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div class="p-6">
                <form>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nom du Wallet</label>
                        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nom du wallet">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Devise</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="USD">USD</option>
                            <option value="CDF">CDF</option>
                        </select>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeModal('createWalletModal')" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                            Annuler
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                            Créer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Commission -->
    <div id="addCommissionModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform transition-all duration-300 animate-fadeIn">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-800">Ajouter Commission</h3>
                <button onclick="closeModal('addCommissionModal')" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div class="p-6">
                <form>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Montant</label>
                        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Montant de la commission">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="3" placeholder="Description de la commission"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeModal('addCommissionModal')" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                            Annuler
                        </button>
                        <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">
                            Ajouter
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Retrait -->
    <div id="withdrawModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform transition-all duration-300 animate-fadeIn">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-800">Retirer des Fonds</h3>
                <button onclick="closeModal('withdrawModal')" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div class="p-6">
                <div class="mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
                    <p class="text-sm text-yellow-800">
                        <strong>Wallet:</strong> <span id="withdrawWalletName">Test Wallet</span><br>
                        <strong>Solde disponible:</strong> <span id="withdrawBalance">1000</span> USD
                    </p>
                </div>
                <form>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Montant à retirer</label>
                        <input type="number" id="withdrawAmount" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" placeholder="Montant">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Motif</label>
                        <textarea class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" rows="3" placeholder="Motif du retrait"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeModal('withdrawModal')" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                            Annuler
                        </button>
                        <button type="submit" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                            Retirer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script>
        // Fonctions modales identiques à celles de VintApp
        function openModal(modalId) {
            console.log('Ouverture du modal:', modalId);
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
                logToConsole('✅ Modal ouvert: ' + modalId);
            } else {
                console.error('Modal non trouvé:', modalId);
                logToConsole('❌ Modal non trouvé: ' + modalId);
            }
        }

        function closeModal(modalId) {
            console.log('Fermeture du modal:', modalId);
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = '';
                logToConsole('✅ Modal fermé: ' + modalId);
            }
        }

        function openCommissionModal() {
            console.log('Ouverture du modal de commission');
            openModal('addCommissionModal');
        }

        function openWithdrawModal(walletId, walletName, balance) {
            console.log('Ouverture du modal de retrait pour wallet:', walletId, walletName, balance);
            
            // Mettre à jour les informations du modal
            document.getElementById('withdrawWalletName').textContent = walletName;
            document.getElementById('withdrawBalance').textContent = balance;
            
            openModal('withdrawModal');
        }

        // Gestion des événements clavier et clics extérieurs
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modals = ['createWalletModal', 'addCommissionModal', 'withdrawModal'];
                modals.forEach(modalId => {
                    const modal = document.getElementById(modalId);
                    if (modal && !modal.classList.contains('hidden')) {
                        closeModal(modalId);
                        logToConsole('✅ Modal fermé avec Escape: ' + modalId);
                    }
                });
            }
        });

        // Fermer les modals en cliquant à l'extérieur
        ['createWalletModal', 'addCommissionModal', 'withdrawModal'].forEach(modalId => {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeModal(modalId);
                        logToConsole('✅ Modal fermé par clic extérieur: ' + modalId);
                    }
                });
            }
        });

        // Fonction pour logger dans la console de test
        function logToConsole(message) {
            const console = document.getElementById('testResults');
            if (console) {
                const timestamp = new Date().toLocaleTimeString();
                console.innerHTML += `<div>[${timestamp}] ${message}</div>`;
                console.scrollTop = console.scrollHeight;
            }
        }

        // Fonction de diagnostic
        function runDiagnostic() {
            const diagnostic = document.getElementById('diagnostic');
            let results = [];
            
            // Test des fonctions
            results.push(`✅ openModal: ${typeof openModal === 'function' ? 'OK' : 'ERREUR'}`);
            results.push(`✅ closeModal: ${typeof closeModal === 'function' ? 'OK' : 'ERREUR'}`);
            results.push(`✅ openCommissionModal: ${typeof openCommissionModal === 'function' ? 'OK' : 'ERREUR'}`);
            results.push(`✅ openWithdrawModal: ${typeof openWithdrawModal === 'function' ? 'OK' : 'ERREUR'}`);
            
            // Test des modals
            const modals = ['createWalletModal', 'addCommissionModal', 'withdrawModal'];
            modals.forEach(modalId => {
                const modal = document.getElementById(modalId);
                results.push(`📋 ${modalId}: ${modal ? 'TROUVÉ' : 'MANQUANT'}`);
            });
            
            // Test des boutons
            const buttons = document.querySelectorAll('[onclick*="Modal"]');
            results.push(`🔘 Boutons avec onclick: ${buttons.length}`);
            
            diagnostic.innerHTML = results.join('<br>');
        }

        // Fonction de tests automatiques
        function runTests() {
            const console = document.getElementById('testResults');
            console.innerHTML = '<div>🚀 Démarrage des tests...</div>';
            
            logToConsole('=== TEST DES MODALS ===');
            
            // Test 1: Ouverture des modals
            setTimeout(() => {
                logToConsole('Test 1: Ouverture du modal createWalletModal');
                openModal('createWalletModal');
            }, 1000);
            
            setTimeout(() => {
                logToConsole('Test 1: Fermeture du modal createWalletModal');
                closeModal('createWalletModal');
            }, 3000);
            
            // Test 2: Modal commission
            setTimeout(() => {
                logToConsole('Test 2: Ouverture du modal de commission');
                openCommissionModal();
            }, 5000);
            
            setTimeout(() => {
                logToConsole('Test 2: Fermeture du modal de commission');
                closeModal('addCommissionModal');
            }, 7000);
            
            // Test 3: Modal retrait
            setTimeout(() => {
                logToConsole('Test 3: Ouverture du modal de retrait');
                openWithdrawModal(1, 'Test Wallet', 1000);
            }, 9000);
            
            setTimeout(() => {
                logToConsole('Test 3: Fermeture du modal de retrait');
                closeModal('withdrawModal');
            }, 11000);
            
            setTimeout(() => {
                logToConsole('✅ Tous les tests terminés !');
                logToConsole('Si les modals se sont ouverts et fermés correctement, le système fonctionne.');
            }, 13000);
        }

        // Exécuter le diagnostic au chargement
        document.addEventListener('DOMContentLoaded', function() {
            runDiagnostic();
            logToConsole('🔄 Page de test chargée');
            logToConsole('Utilisez les boutons pour tester manuellement les modals');
        });
    </script>
</body>
</html>
