<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PWA Install Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-4">🧪 Test Bouton Installation PWA</h1>
        
        <div class="space-y-4">
            <div class="p-4 bg-blue-50 rounded">
                <h2 class="font-semibold mb-2">Statut:</h2>
                <div id="status" class="text-sm"></div>
            </div>
            
            <div class="p-4 bg-green-50 rounded">
                <h2 class="font-semibold mb-2">Actions:</h2>
                <button onclick="testShowButton()" class="bg-blue-600 text-white px-4 py-2 rounded mr-2">
                    Afficher Bouton
                </button>
                <button onclick="clearCache()" class="bg-red-600 text-white px-4 py-2 rounded">
                    Clear Cache
                </button>
            </div>
            
            <div class="p-4 bg-yellow-50 rounded">
                <h2 class="font-semibold mb-2">Console Logs:</h2>
                <div id="console" class="text-xs font-mono bg-black text-green-400 p-2 rounded h-64 overflow-auto"></div>
            </div>
        </div>
    </div>

    <script>
        // Intercepter les console.log
        const consoleDiv = document.getElementById('console');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleDiv.innerHTML += args.join(' ') + '<br>';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        // Tester l'affichage du bouton
        function testShowButton() {
            console.log('🧪 Test affichage bouton...');
            
            // Vérifier si déjà installé
            const isInstalled = window.matchMedia('(display-mode: standalone)').matches;
            console.log('App installée:', isInstalled);
            
            // Vérifier localStorage
            const dismissed = localStorage.getItem('pwa-install-dismissed');
            console.log('Dismiss timestamp:', dismissed);
            
            if (dismissed) {
                const hoursSince = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60);
                console.log('Heures depuis dismiss:', hoursSince.toFixed(2));
            }
            
            // Créer le bouton manuellement
            if (!document.getElementById('pwa-install-button')) {
                const btn = document.createElement('button');
                btn.id = 'pwa-install-button';
                btn.className = 'fixed bottom-20 right-4 bg-purple-600 text-white px-6 py-3 rounded-full shadow-lg hover:bg-purple-700 transition-all z-50 flex items-center space-x-2';
                btn.innerHTML = `
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="font-medium">Installer l'app TEST</span>
                `;
                btn.onclick = () => {
                    console.log('✅ Bouton cliqué!');
                    alert('Bouton fonctionne! Le vrai bouton devrait faire pareil.');
                };
                document.body.appendChild(btn);
                console.log('✅ Bouton créé et ajouté au DOM');
            } else {
                console.log('⚠️ Bouton déjà présent');
            }
        }

        function clearCache() {
            localStorage.removeItem('pwa-install-dismissed');
            console.log('✅ Cache cleared');
            location.reload();
        }

        // Vérifier au chargement
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📄 Page chargée');
            console.log('Service Worker supporté:', 'serviceWorker' in navigator);
            console.log('beforeinstallprompt supporté:', 'onbeforeinstallprompt' in window);
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <div class="space-y-1">
                    <div>✅ Service Worker: ${'serviceWorker' in navigator ? 'Supporté' : 'Non supporté'}</div>
                    <div>✅ beforeinstallprompt: ${'onbeforeinstallprompt' in window ? 'Supporté' : 'Non supporté'}</div>
                    <div>✅ Display mode: ${window.matchMedia('(display-mode: standalone)').matches ? 'Standalone' : 'Browser'}</div>
                    <div>✅ HTTPS: ${location.protocol === 'https:' ? 'Oui' : 'Non (localhost OK)'}</div>
                </div>
            `;

            // Test automatique après 3 secondes
            console.log('⏰ Test automatique dans 3 secondes...');
            setTimeout(() => {
                console.log('🚀 Lancement test automatique');
                testShowButton();
            }, 3000);
        });

        // Écouter beforeinstallprompt
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('🎉 beforeinstallprompt REÇU!', e);
            e.preventDefault();
        });
    </script>
</body>
</html>
